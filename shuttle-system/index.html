<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>เข้าสู่ระบบ | Shuttle MUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0f766e 0%, #134e4a 50%, #1e293b 100%); padding: 20px; }
    .login-card { background: #fff; border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 400px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .icon { width: 64px; height: 64px; background: #ccfbf1; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 28px; }
    .login-logo h1 { font-size: 1.4rem; margin: 0 0 4px; color: #0f172a; }
    .login-logo p { margin: 0; color: #64748b; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">🚌</div>
        <h1>Shuttle Bus MUT</h1>
        <p>มหาวิทยาลัยเทคโนโลยีมหานคร</p>
      </div>

      <form onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label">รหัสผู้ใช้ / รหัสพนักงาน / อีเมล</label>
          <input type="text" class="form-control" id="login-id" placeholder="เช่น 123456 หรือ EMP001" required value="123456">
        </div>
        <div class="form-group">
          <label class="form-label">รหัสผ่าน</label>
          <input type="password" class="form-control" id="login-pass" placeholder="••••••••" required value="1234">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;padding:14px;">เข้าสู่ระบบ</button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:0.9rem;color:#64748b;">
        ยังไม่มีบัญชี?
        <a href="register.html" style="color:#0d9488;font-weight:600;">สมัครสมาชิก</a>
      </p>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:0.78rem;color:#94a3b8;text-align:center;line-height:1.6;">
        ตัวอย่างเข้าสู่ระบบ (รหัสผ่านทุกบัญชี: <b>1234</b>)<br>
        ผู้ใช้: <b>123456</b> · คนขับ: <b>EMP001</b> · Admin: <b>EMP004</b>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    function doLogin(e) {
      e.preventDefault();
      const id = document.getElementById('login-id').value.trim();
      const pass = document.getElementById('login-pass').value;

      // 1) ลองหาเป็นพนักงานก่อน
      const emp = window.EMPLOYEES.find(x =>
        (x.code.toUpperCase() === id.toUpperCase()) && x.password === pass
      );
      if (emp) {
        const pos = window.getPos(emp.pos);
        window.saveSession('staff', {
          empCode: emp.code,
          name: emp.first + ' ' + emp.last,
          posCode: pos.code,
          posName: pos.name,
          rights: pos.rights,
          dept: emp.dept
        });
        if (emp.pos === '03') {
          location.href = 'driver/trips.html';
        } else {
          const first = window.SCREEN_MAP.find(s => window.hasRight(pos.rights, s.bit));
          location.href = first ? 'admin/' + first.href : 'admin/dashboard.html';
        }
        return;
      }

      // 2) ผู้ใช้บริการ
      const user = window.USERS.find(u =>
        (u.username === id || u.email === id || u.code === id) && u.password === pass
      );
      if (user) {
        window.saveSession('passenger', {
          userCode: user.code,
          name: user.first + ' ' + user.last,
          username: user.username
        });
        location.href = 'passenger/home.html';
        return;
      }

      alert('รหัสผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    }
  </script>
</body>
</html>
